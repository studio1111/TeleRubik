name: Telegram file inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-file-inventory.yml"
  workflow_dispatch:
    inputs:
      message_limit:
        description: "Maximum recent channel messages to inspect (1-10000)"
        required: true
        default: "2000"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-file-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      INVENTORY_MESSAGE_LIMIT: ${{ inputs.message_limit || '2000' }}
    steps:
      - name: Check Telegram secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing repository Actions secret: $key"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install inventory dependency
        run: python -m pip install "Telethon==1.42.0"
      - name: Validate scan limit
        run: |
          python -c 'import os; value = int(os.environ["INVENTORY_MESSAGE_LIMIT"]); assert 1 <= value <= 10000, "message_limit must be between 1 and 10000"'
      - name: Scan @Animehighbo and create JSON/CSV reports
        run: python -m scripts.telegram_inventory
      - name: Upload inventory reports
        uses: actions/upload-artifact@v4
        with:
          name: telegram-file-inventory-${{ github.run_number }}
          path: |
            inventory/telegram-file-inventory.json
            inventory/telegram-file-inventory.csv
            inventory/large-1080p-candidates.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean temporary reports
        if: always()
        run: rm -rf inventory
