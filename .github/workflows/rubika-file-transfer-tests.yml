name: Rubika file transfer tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rubika-file-transfer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubika-file-transfer-tests
  cancel-in-progress: false

jobs:
  transfer-tests:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-transfer-tests]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING RUBIKA_BOT_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing repository Actions secret: $key"
              exit 1
            fi
          done
      - name: Install pinned transfer dependencies
        run: python -m pip install "Telethon==1.42.0" "rubpy==7.3.5"
      - name: Download and test one 1080p source file
        run: python scripts/run_transfer_tests.py
      - name: Upload sanitized test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubika-transfer-test-${{ github.run_number }}
          path: transfer-test-report.json
          if-no-files-found: warn
          retention-days: 7
