name: Rubika image smoke test

on:
  workflow_dispatch:
    inputs:
      allow_live_send:
        description: "Authorize sending only Telegram image message 1518 (expected 17,843 bytes) to the configured Rubika destination"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telerubik-image-smoke-test
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer approved image message 1518
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      RUBIKA_SESSION_B64: ${{ secrets.RUBIKA_SESSION_B64 }}
      RUBIKA_DESTINATION_GUID: ${{ secrets.RUBIKA_DESTINATION_GUID }}
      TELEGRAM_SOURCE_CHATS: "@Animehighbo"
      TELERUBIK_MAX_FILE_SIZE_MB: "1"
      TELERUBIK_DRY_RUN: "false"

    steps:
      - name: Require explicit live-send authorization
        if: ${{ inputs.allow_live_send != true }}
        run: |
          echo "::error::Live send was not authorized. Re-run manually and set allow_live_send=true."
          exit 1

      - name: Check required secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING RUBIKA_SESSION_B64 RUBIKA_DESTINATION_GUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $key"
              exit 1
            fi
          done
          echo "Required remote credentials are present."

      - name: Configure isolated temporary paths
        shell: bash
        env:
          RUBIKA_SESSION_NAME: ${{ runner.temp }}/telerubik-private/rubika_session
          TELERUBIK_DOWNLOAD_DIR: ${{ runner.temp }}/telerubik-downloads
          TELERUBIK_STATE_DB: ${{ runner.temp }}/telerubik-data/remote-transfer.sqlite3
        run: |
          set -euo pipefail
          {
            printf 'RUBIKA_SESSION_NAME=%s\n' "$RUBIKA_SESSION_NAME"
            printf 'TELERUBIK_DOWNLOAD_DIR=%s\n' "$TELERUBIK_DOWNLOAD_DIR"
            printf 'TELERUBIK_STATE_DB=%s\n' "$TELERUBIK_STATE_DB"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provision private Rubpy session
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/telerubik-private"
          printf '%s' "$RUBIKA_SESSION_B64" | base64 --decode > "$RUBIKA_SESSION_NAME.rp"
          chmod 600 "$RUBIKA_SESSION_NAME.rp"
          unset RUBIKA_SESSION_B64
          test -s "$RUBIKA_SESSION_NAME.rp"
          echo "Rubpy session provisioned in runner temporary storage."

      - name: Install TeleRubik
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Preflight exact Telegram image and resolve safe filename
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telerubik.security import safe_filename

          EXPECTED_MESSAGE_ID = 1518
          EXPECTED_SIZE = 17843
          SOURCE_CHAT = "@Animehighbo"

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TELEGRAM_SESSION_STRING"]),
                  int(os.environ["TELEGRAM_API_ID"]),
                  os.environ["TELEGRAM_API_HASH"],
              )
              try:
                  await client.connect()
                  if not await client.is_user_authorized():
                      raise RuntimeError("Telegram session is not authorized")
                  entity = await client.get_entity(SOURCE_CHAT)
                  message = await client.get_messages(entity, ids=EXPECTED_MESSAGE_ID)
                  if message is None or getattr(message, "id", None) != EXPECTED_MESSAGE_ID:
                      raise RuntimeError("Approved Telegram image message 1518 was not found")
                  if not getattr(message, "media", None):
                      raise RuntimeError("Approved Telegram message has no media")
                  file = getattr(message, "file", None)
                  mime_type = getattr(file, "mime_type", None)
                  if not isinstance(mime_type, str) or not mime_type.lower().startswith("image/"):
                      raise RuntimeError("Message 1518 is not verified as an image")
                  size = getattr(file, "size", None)
                  if type(size) is not int or size != EXPECTED_SIZE:
                      raise RuntimeError(
                          f"Image size mismatch: expected {EXPECTED_SIZE} bytes; "
                          f"received {size!r}"
                      )
                  filename = safe_filename(getattr(file, "name", None))
                  if not filename or filename in {".", ".."} or "\n" in filename or "\r" in filename:
                      raise RuntimeError("Telegram image filename is not safe")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"filename={filename}\n")
                  print(
                      f"Preflight passed: message_id={EXPECTED_MESSAGE_ID}, "
                      f"mime_type={mime_type}, bytes={size}, filename={filename}"
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

      - name: Transfer only Telegram image message 1518
        env:
          EXPECTED_FILENAME: ${{ steps.preflight.outputs.filename }}
        run: >-
          telerubik transfer-one
          --source-chat @Animehighbo
          --message-id 1518
          --expected-filename "$EXPECTED_FILENAME"

      - name: Remove temporary media, session and state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/telerubik-downloads"
          rm -rf "$RUNNER_TEMP/telerubik-data"
          rm -rf "$RUNNER_TEMP/telerubik-private"
          echo "Temporary transfer files and session removed."
