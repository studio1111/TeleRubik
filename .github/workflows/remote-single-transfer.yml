name: Remote single-file transfer

on:
  workflow_dispatch:
    inputs:
      allow_live_send:
        description: "Actually send the single approved Spider-Man file to the configured private Rubika destination"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telerubik-remote-single-transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer approved Telegram message 1734 on remote runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_SOURCE_CHATS: "@Animehighbo"
      RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
      RUBIKA_DESTINATION_GUID: ${{ secrets.RUBIKA_DESTINATION_GUID }}
      TELERUBIK_MAX_FILE_SIZE_MB: "2048"
      TELERUBIK_DRY_RUN: ${{ inputs.allow_live_send == false }}
      TELERUBIK_DOWNLOAD_DIR: "./downloads"
      TELERUBIK_STATE_DB: "./data/remote-transfer.sqlite3"
    steps:
      - name: Check required secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING RUBIKA_BOT_TOKEN RUBIKA_DESTINATION_GUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $key"
              exit 1
            fi
          done
          echo "Required remote credentials are present."

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TeleRubik
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify isolated target and remote disk capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads data
          df -h .
          python - <<'PY'
          import shutil
          free = shutil.disk_usage(".").free
          print(f"Remote runner free disk: {free // (1024 * 1024)} MiB")
          if free < 3 * 1024 * 1024 * 1024:
              raise SystemExit("At least 3 GiB free disk is required for the 1.74 GB target plus reserve.")
          PY

      - name: Transfer only the approved Spider-Man message
        run: >-
          telerubik transfer-one
          --source-chat @Animehighbo
          --message-id 1734
          --expected-filename "Spider-Man.Brand.New.Day.2026.720p.WEB-DL.ValaMovie.mkv"

      - name: Remove all temporary media and session state
        if: always()
        shell: bash
        run: |
          rm -rf downloads data private
          echo "Temporary remote transfer files removed."
