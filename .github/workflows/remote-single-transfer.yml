name: Remote single-file transfer

on:
  workflow_dispatch:
    inputs:
      allow_live_send:
        description: "Authorize the one-time live send of Telegram message 1734 to the configured private Rubika destination"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telerubik-remote-single-transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer approved Telegram message 1734
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_SOURCE_CHATS: "@Animehighbo"
      RUBIKA_SESSION_B64: ${{ secrets.RUBIKA_SESSION_B64 }}
      RUBIKA_DESTINATION_GUID: ${{ secrets.RUBIKA_DESTINATION_GUID }}
      TELERUBIK_MAX_FILE_SIZE_MB: "2048"
      TELERUBIK_DRY_RUN: "false"
    steps:
      - name: Require explicit live-send authorization
        if: ${{ inputs.allow_live_send != true }}
        run: |
          echo "::error::Live send was not authorized. Re-run manually and set allow_live_send=true."
          exit 1

      - name: Check required secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING RUBIKA_SESSION_B64 RUBIKA_DESTINATION_GUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $key"
              exit 1
            fi
          done
          echo "Required remote credentials are present."

      - name: Configure runner temporary paths
        shell: bash
        env:
          RUBIKA_SESSION_NAME: ${{ runner.temp }}/telerubik-private/rubika_session
          TELERUBIK_DOWNLOAD_DIR: ${{ runner.temp }}/telerubik-downloads
          TELERUBIK_STATE_DB: ${{ runner.temp }}/telerubik-data/remote-transfer.sqlite3
        run: |
          set -euo pipefail
          {
            printf 'RUBIKA_SESSION_NAME=%s\n' "$RUBIKA_SESSION_NAME"
            printf 'TELERUBIK_DOWNLOAD_DIR=%s\n' "$TELERUBIK_DOWNLOAD_DIR"
            printf 'TELERUBIK_STATE_DB=%s\n' "$TELERUBIK_STATE_DB"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provision private Rubpy session
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/telerubik-private"
          printf '%s' "$RUBIKA_SESSION_B64" | base64 --decode > "$RUBIKA_SESSION_NAME.rp"
          chmod 600 "$RUBIKA_SESSION_NAME.rp"
          unset RUBIKA_SESSION_B64
          test -s "$RUBIKA_SESSION_NAME.rp"
          echo "Rubpy session provisioned in runner temporary storage."

      - name: Install TeleRubik
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          python - <<'PY'
          import shutil
          free = shutil.disk_usage(__import__("os").environ["RUNNER_TEMP"]).free
          print(f"Runner temporary free disk: {free // (1024 * 1024)} MiB")
          if free < 3 * 1024 * 1024 * 1024:
              raise SystemExit("At least 3 GiB free disk is required for the approved media and reserve.")
          PY

      - name: Transfer only Telegram message 1734
        run: >-
          telerubik transfer-one
          --source-chat @Animehighbo
          --message-id 1734
          --expected-filename "Spider-Man.Brand.New.Day.2026.720p.WEB-DL.ValaMovie.mkv"

      - name: Remove temporary media, session and state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/telerubik-downloads"
          rm -rf "$RUNNER_TEMP/telerubik-data"
          rm -rf "$RUNNER_TEMP/telerubik-private"
          echo "Temporary transfer files and session removed."
