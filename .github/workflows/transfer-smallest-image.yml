name: Transfer approved smallest Telegram image

on:
  workflow_dispatch:
    inputs:
      allow_live_send:
        description: "Authorize sending exactly Telegram message 1518 (JPEG, 17,843 bytes) as a downloadable file, not an inline photo preview, to the configured private Rubika destination"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telerubik-small-image-live-send
  cancel-in-progress: false

jobs:
  transfer:
    if: ${{ inputs.allow_live_send == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      RUBIKA_SESSION_B64: ${{ secrets.RUBIKA_SESSION_B64 }}
      RUBIKA_DESTINATION_GUID: ${{ secrets.RUBIKA_DESTINATION_GUID }}
      TELERUBIK_MAX_FILE_SIZE_MB: "2048"
      TELERUBIK_DRY_RUN: "false"
    steps:
      - name: Require all credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING RUBIKA_SESSION_B64 RUBIKA_DESTINATION_GUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $key"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare isolated runner temp paths
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/telerubik-private" "$RUNNER_TEMP/telerubik-downloads" "$RUNNER_TEMP/telerubik-data"
          printf 'RUBIKA_SESSION_NAME=%s\n' "$RUNNER_TEMP/telerubik-private/rubika_session" >> "$GITHUB_ENV"
          printf 'TELERUBIK_DOWNLOAD_DIR=%s\n' "$RUNNER_TEMP/telerubik-downloads" >> "$GITHUB_ENV"
          printf 'TELERUBIK_STATE_DB=%s\n' "$RUNNER_TEMP/telerubik-data/remote-transfer.sqlite3" >> "$GITHUB_ENV"

      - name: Provision authenticated Rubpy session
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RUBIKA_SESSION_B64" | base64 --decode > "$RUBIKA_SESSION_NAME.rp"
          chmod 600 "$RUBIKA_SESSION_NAME.rp"
          unset RUBIKA_SESSION_B64
          test -s "$RUBIKA_SESSION_NAME.rp"

      - name: Install TeleRubik
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Transfer only the inventoried 17.4 KiB JPEG
        run: >-
          telerubik transfer-one
          --source-chat @Animehighbo
          --message-id 1518
          --expected-mime-type image/jpeg
          --expected-size-bytes 17843

      - name: Remove temporary media, session and state
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/telerubik-downloads"
          rm -rf "$RUNNER_TEMP/telerubik-data"
          rm -rf "$RUNNER_TEMP/telerubik-private"
