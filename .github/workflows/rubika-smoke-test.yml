name: Rubika private-destination user-session smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_live_test:
        description: "Confirm that the configured private Rubika destination is yours and may receive one small test file"
        required: true
        type: choice
        options:
          - NO_LIVE_SEND
          - I_CONFIRM_PRIVATE_DESTINATION
        default: NO_LIVE_SEND

permissions:
  contents: read

concurrency:
  group: rubika-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    if: ${{ inputs.confirm_live_test == 'I_CONFIRM_PRIVATE_DESTINATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUBIKA_SESSION_B64: ${{ secrets.RUBIKA_SESSION_B64 }}
      RUBIKA_SESSION_NAME: ${{ runner.temp }}/telerubik-private/rubika_session
      RUBIKA_DESTINATION_GUID: ${{ secrets.RUBIKA_DESTINATION_GUID }}
    steps:
      - name: Check required secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          for key in RUBIKA_SESSION_B64 RUBIKA_DESTINATION_GUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $key"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provision private user session
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/telerubik-private"
          printf '%s' "$RUBIKA_SESSION_B64" | base64 --decode > "$RUBIKA_SESSION_NAME.rp"
          chmod 600 "$RUBIKA_SESSION_NAME.rp"
          unset RUBIKA_SESSION_B64
          test -s "$RUBIKA_SESSION_NAME.rp"
          echo "Private Rubpy session provisioned."

      - name: Install TeleRubik
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Send one generated 1 KiB file through the production user-account adapter
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os
          import tempfile
          from pathlib import Path
          from telerubik.adapters import RubikaSender

          async def main():
              destination = os.environ.get("RUBIKA_DESTINATION_GUID", "").strip()
              session = os.environ["RUBIKA_SESSION_NAME"]
              if not destination:
                  raise SystemExit("Private destination secret is missing; no file was sent.")

              sender = RubikaSender(session, destination)
              try:
                  await sender.start()
                  with tempfile.TemporaryDirectory(prefix="telerubik-smoke-") as directory:
                      path = Path(directory) / "telerubik-smoke-test.txt"
                      path.write_bytes(
                          b"TeleRubik user-session smoke test\\n" + b"x" * 1024
                      )
                      result = await sender.send_document(
                          path,
                          "TeleRubik: one small-file delivery verification."
                      )
                      message_id = (
                          result.get("message_id")
                          if isinstance(result, dict)
                          else getattr(result, "message_id", None)
                      )
                      if not message_id:
                          raise RuntimeError("Rubika accepted no verifiable message identifier.")
                      print(
                          "SMOKE_TEST_ACCEPTED: stage=complete "
                          f"file_bytes={path.stat().st_size} "
                          f"response_type={type(result).__name__}"
                      )
              finally:
                  await sender.close()

          asyncio.run(main())
          PY

      - name: Remove private session and temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/telerubik-private"
